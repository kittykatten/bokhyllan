<style>
/* Layout: one-screen app. Top bar + tabs (bottom bar on phones), content scrolls. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --ink:#1b2420; --muted:#5f6b66; --line:#dde2de;
  --accent:#1d5c4d; --accent-soft:#e2eee9; --star:#b7841a; --nov:#4f9a86; --nov-now:#d6aa4f;
  --good:#2f7a3f; --warn:#a86a0c; --bad:#a23b3b; --info:#355f8c;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1a221e; --ink:#e7ece9; --muted:#9aa8a1; --line:#2c3732;
    --accent:#6fc2a9; --accent-soft:#203a32; --star:#e2b44c; --nov:#2f7563; --nov-now:#9c7a2c;
    --good:#7cc98a; --warn:#e3a74a; --bad:#e58a8a; --info:#8ab4e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e7ece9; --muted:#9aa8a1; --line:#2c3732;
  --accent:#6fc2a9; --accent-soft:#203a32; --star:#e2b44c; --nov:#2f7563; --nov-now:#9c7a2c;
  --good:#7cc98a; --warn:#e3a74a; --bad:#e58a8a; --info:#8ab4e0;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);font-weight:650;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.top h1{font-size:22px;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
main{flex:1;overflow:auto;padding:16px;}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (max-width:700px){
  .top{flex-wrap:wrap}
  nav.tabs{order:3;position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
  nav.tabs a{font-size:13px;padding:8px 4px} nav.tabs .badge{margin-left:3px;font-size:11px;min-width:16px;padding:0 4px}
  main{padding-bottom:80px}
}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip .n{opacity:.7;font-variant-numeric:tabular-nums;margin-left:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cover{width:40px;height:60px;border-radius:3px;object-fit:cover;background:var(--accent-soft);display:block;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cover.ph{display:flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--accent);font-size:18px;box-shadow:none}
.cover.big{width:96px;height:144px;font-size:34px}
.item{display:grid;grid-template-columns:4px 40px 1fr auto;gap:12px;padding:10px 14px 10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.item .stripe{align-self:stretch;border-radius:0 3px 3px 0}
.item .t{font-weight:600}
.item .a{color:var(--muted);font-size:14px}
.item .m{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.ph-read{color:var(--good)} .ph-reading{color:var(--info)} .ph-tbr{color:var(--muted)} .ph-dnf{color:var(--bad)}
.stripe.ph-read{background:var(--good)} .stripe.ph-reading{background:var(--info)} .stripe.ph-tbr{background:var(--line)} .stripe.ph-dnf{background:var(--bad)}
.stars{color:var(--star);letter-spacing:1px;font-size:14px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .v{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .bar{fill:var(--accent)}
.chart .bar.now{fill:var(--star)}
.chart .bar.nov{fill:var(--nov)} .chart .bar.nov.now2{fill:var(--nov-now)}
.tile .delta{font-size:13px;color:var(--muted);margin-top:4px}
.hbar.click{cursor:pointer;border-radius:6px} .hbar.click:hover,.hbar.click[aria-pressed="true"]{background:var(--accent-soft)}
.tile.click{cursor:pointer} .tile.click:hover{border-color:var(--accent)}
.drop-over{outline:2px dashed var(--accent);outline-offset:2px;background:var(--accent-soft)}
[draggable="true"]{cursor:grab}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.rec{border:1px solid var(--line);border-radius:10px;padding:10px 12px} .rec[data-drill]{cursor:pointer} .rec[data-drill]:hover{border-color:var(--accent)}
.rec .t{font-weight:600;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:4px} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart .bar:hover{opacity:.8}
.chart .grid{stroke:var(--line)}
.hbars{display:flex;flex-direction:column;gap:6px}
.hbar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.hbar .track{height:12px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hbar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h3{font-size:17px}
.prog{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:20}
.dialog{background:var(--surface);border-radius:14px;max-width:640px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form label.wide{grid-column:1/-1}
.form input,.form select,.form textarea{color:var(--ink);font-size:15px}
.rate{display:flex;gap:2px}
.rate button{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:var(--star)}
.notice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:8px}
.notice.err{border-color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mon{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:120px}
.mon:hover{border-color:var(--accent)}
.mon.now{border:2px solid var(--accent)}
.mon.past{opacity:.75}
.mon h3{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.mon h3 small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.mon ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mon li{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.dot.ph-read{background:var(--good)} .dot.ph-reading{background:var(--info)} .dot.ph-dnf{background:var(--bad)}
.q{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .lab b{display:block;font-weight:600}
.q .lab span{color:var(--muted);font-size:13px}
.seg{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{min-width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.score{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.genre{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.genre.sugg{background:none;border:1px dashed var(--accent)}
.pick{border:2px solid var(--star)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.mini{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mini:last-child{border-bottom:0}
.mini .t{font-weight:600;font-size:14px}
.mini .s{color:var(--muted);font-size:13px}
.due-soon{color:var(--bad);font-weight:600}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.menu a{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink)}
.menu a:hover{border-color:var(--accent)}
.menu a b{font-family:var(--display);font-size:18px}
.menu a span{color:var(--muted);font-size:13px}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:var(--surface);font-size:12px;text-align:center;margin-left:6px;font-family:var(--body)}
.alink{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;text-align:left}
.alink:hover{color:var(--accent);text-decoration-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const FIREBASE_CONFIG = {

const SHEET_ID = "";
const CHUNK = 150;
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_SV = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const MON_SV_LONG = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];
const STATUSES = ["","Ska lånas","Ska köpas","Köpt","Lånad","Lokal fil","Waitlist","On hold","Suspended","Kanske"];
const DROP_REASONS=["Gav upp","Lockar inte längre","Har legat för länge","Tillgänglighet"];
const DROP_RENAME={"Slutade läsa":"Gav upp","Kanske senare":"Lockar inte längre","Inte min grej":"Lockar inte längre","Går inte att få tag på":"Tillgänglighet"};
// Reason for books dropped before the app, read from the sheet's comment, status, months on list (MOL) and start date.
function guessDropReason(b){
  const c=String(b.comment||"").toLowerCase();
  if(/tillgänglighet|pris/.test(c)) return "Tillgänglighet";
  if(/feeling|poesi|murderbot/.test(c)) return "Lockar inte längre";
  if(/gav upp|läste \d|redan försökt/.test(c) || b.status==="Gav upp" || b.started) return "Gav upp";
  if(/månader på listan|legat/.test(c) || +b.mol>=48) return "Har legat för länge";
  if(/tappat intresset|räcker nu/.test(c)) return "Lockar inte längre";
  return "";
}
const PHASE_LABEL = {tbr:"Att läsa", reading:"Läser", read:"Läst", dnf:"Bortvald"};
const GENRES = ["Skönlitteratur","Historisk roman","Deckare & thriller","Fantasy","Science fiction","Skräck","Facklitteratur"];
const GC_GENRE = {"fiction":"Skönlitteratur","historical fiction":"Historisk roman","mystery & thriller":"Deckare & thriller","fantasy":"Fantasy","science fiction":"Science fiction","horror":"Skräck"};
const AVAILABLE = ["Köpt","Lånad","Lokal fil"];
const QUESTIONS = [
  ["plot","Handling","Hur bra var berättelsen och intrigen?",1],
  ["chars","Karaktärer","Hur levande och trovärdiga var karaktärerna?",1],

];

const S = {
  db:null, mcp:null, user:null, isOwner:null,
  docs:{}, loaded:false, error:null,
  books:[], series:[], awards:[], plans:{}, meta:null,
  f:{q:"", phase:"tbr", status:"", kind:"", sort:"plan", limit:150, ser:"", auth:"", avail:false, libby:false, nextSer:false, genre:"", lang:"", maxPages:"", gender:""},
  serQ:"", serFilter:"open", awQ:"", awFilter:"winners", planKey:null,
  importing:null, covers:new Set(), ol:{}, enrichDone:false, gc:[], awSrc:"hn", gcCat:"",

};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(/[\s,]/g,"").replace("%","")); return isFinite(n) ? n : 0; };
const truthy = v => /^(true|yes|ja|x|1)$/i.test(String(v ?? "").trim());
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9åäö]+/g," ").trim();
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

const MONMAP = {jan:1,feb:2,mar:3,apr:4,may:5,maj:5,jun:6,jul:7,aug:8,sep:9,oct:10,okt:10,nov:11,dec:12};
function parseDate(s){
  s = String(s ?? "").trim(); if(!s) return "";
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
  const p2 = n => String(n).padStart(2,"0");
  m = s.match(/^(\d{1,2})\s+([A-Za-zåäö]{3})[A-Za-zåäö]*\.?\s+(\d{4})$/);
  if(m && MONMAP[m[2].toLowerCase()]) return m[3]+"-"+p2(MONMAP[m[2].toLowerCase()])+"-"+p2(m[1]);
  m = s.match(/^([A-Za-zåäö]{3})[A-Za-zåäö]*\.?\s+(\d{1,2}),?\s+(\d{4})$/);
  if(m && MONMAP[m[1].toLowerCase()]) return m[3]+"-"+p2(MONMAP[m[1].toLowerCase()])+"-"+p2(m[2]);
  m = s.match(/^([A-Za-zåäö]{3})[A-Za-zåäö]*\.?\s+(\d{4})$/);
  if(m && MONMAP[m[1].toLowerCase()]) return m[2]+"-"+p2(MONMAP[m[1].toLowerCase()])+"-01";
  m = s.match(/^(\d{4})$/); if(m) return m[1]+"-01-01";
  return s;
}
function fmtDate(iso){
  if(!iso) return ""; const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return iso; return (+m[3])+" "+MON_SV[+m[2]-1]+" "+m[1];
}
function allReads(b){ return [...(b.reads||[]).map(r=>r&&r.read), b.read].filter(Boolean).sort(); }
function everRead(b){ return allReads(b).length>0; }
function phase(b){
  if(b.kind==="removed" || b.status==="Gav upp" || (b.dropped && b.dropped.date)) return "dnf";
  if(b.read) return "read";
  if(b.started) return "reading";

function rebuild(){
  const books=[], series=[], awards=[], gcl=[];
  for(const [id,d] of Object.entries(S.docs)){
    const items = (d && d.items) || {};
    const target = id.startsWith("books_") ? books : id.startsWith("series_") ? series : id.startsWith("awards_") ? awards : id.startsWith("gc_") ? gcl : null;
    if(!target) continue;
    for(const [k,v] of Object.entries(items)) if(v) target.push({...v, id:k, _doc:id});
  }
  S.books=books; S.series=series; S.awards=awards; S.gc=gcl;
  S.plans=(S.docs.plans && S.docs.plans.months) || {};
  S.meta=S.docs.meta || null;

  S.authorDead=(S.docs.authors && S.docs.authors.dead) || {}; S.deadChecked=(S.docs.authors && S.docs.authors.checked2) || {};
  S.ignoreDups=(S.docs.cleanState && S.docs.cleanState.ignoreDups) || {};
  const ig=(S.docs.cleanState && S.docs.cleanState.ignore) || {};
  if(JSON.stringify(ig)!==JSON.stringify(S.cleanIgnore||{})){ S.cleanIgnore=ig; cleanIssues._r=null; cleanProposals._r=null; }

}

const writeQ = {};
function queued(docId, fn){
  const p = (writeQ[docId]||Promise.resolve()).catch(()=>{}).then(fn);
  writeQ[docId]=p; return p;
}
function pickChunk(prefix){
  const ids = Object.keys(S.docs).filter(k=>k.startsWith(prefix+"_")).sort();
  for(const id of ids){ const n=Object.values(S.docs[id].items||{}).filter(Boolean).length; if(n<CHUNK) return id; }
  let i=ids.length; let id; do{ id=prefix+"_"+String(i++).padStart(2,"0"); }while(S.docs[id]); return id;
}
async function putItem(prefix, id, item, docId){
  const clean = {...item}; delete clean.id; delete clean._doc;
  for(const k of Object.keys(clean)) if(clean[k]===undefined) delete clean[k];
  docId = docId || pickChunk(prefix);
  const ref = S.db.doc("lib/"+docId);
  try{
    await queued(docId, ()=> S.docs[docId] ? ref.update({items:{[id]:clean}}) : ref.set({items:{[id]:clean}}));
  }catch(e){ dbFail(e); throw e; }
  return docId;
}
async function removeItem(id, docId){
  try{ await queued(docId, ()=>S.db.doc("lib/"+docId).update({items:{[id]:null}})); }
  catch(e){ dbFail(e); throw e; }
}
async function savePlans(months){
  try{ await queued("plans", ()=>S.db.doc("lib/plans").set({months})); }
  catch(e){ dbFail(e); throw e; }
}
function dbFail(e){
  const c = e && e.code;
  if(c==="quota_exceeded") toast("Databasen är full. Ta bort något och försök igen.");
  else if(c==="resource_exhausted") toast("För många ändringar på en gång. Vänta en stund.");
  else if(c==="invalid_argument") toast("Kunde inte spara. Bara ägaren kan ändra i appen.");
  else toast("Kunde inte spara just nu. Försök igen.");
}

async function getRange(range){

  const p = r && r.payload;
  return (p && p.values) || [];

const BOOK_FIELDS = {"titel":"title","författare":"author","kön":"gender","språk":"lang","originalspråk":"origLang","år":"year","sidor":"pages","serie":"series","nummer":"num","plan":"plan","status":"status","kommentar":"comment","tillagd":"added","börjat":"started","läst":"read","källa":"source","format":"format","mol":"mol","dtr":"dtr"};
function rowsToBooks(grid, kind, prefix){
  const head = (grid[0]||[]).map(h=>String(h||"").trim());
  const out=[];
  for(let r=1;r<grid.length;r++){
    const row=grid[r]||[]; const b={kind, extra:{}};
    head.forEach((h,i)=>{
      const v = String(row[i] ?? "").trim(); if(!h) return;
      const f = BOOK_FIELDS[h.toLowerCase()];
      if(f){ if(!(f in b) || !b[f]) b[f]=v; } else if(v) b.extra[h]=v;
    });
    if(!b.title) continue;
    b.year = b.year && /^\d{3,4}$/.test(b.year) ? +b.year : (b.year||"");
    b.pages = num(b.pages) || "";
    if(b.series){ const ps=parseSeriesField(b.series); b.series=ps.name; if(ps.num && !b.num) b.num=ps.num; }
    b.num = firstNum(b.num);
    if(langName(b.lang)==="Engelska"){ const tc=titleCase(b.title); if(tc!==b.title){ b.titleOrig=b.title; b.title=tc; } }
    for(const k of ["added","started","read"]) b[k]=parseDate(b[k]);
    b.rating = 0;
    out.push([prefix+r, b]);
  }
  return out;
}
function rowsToSeries(grid){
  const head=(grid[0]||[]).map(h=>String(h||"").trim().toLowerCase()); const ix=n=>head.indexOf(n);
  const out=[];
  for(let r=1;r<grid.length;r++){
    const row=grid[r]||[]; const g=i=>i<0?"":String(row[i]??"").trim();
    const t=g(ix("titel")); if(!t) continue;
    out.push(["s"+r,{title:t,author:g(ix("författare")),series:g(ix("serie")),num:g(ix("nummer")),year:g(ix("år")),pages:num(g(ix("sidor")))||"",lang:g(ix("språk")),inList:truthy(g(ix("i lista?"))),read:truthy(g(ix("läst"))),comment:g(ix("kommentar"))}]);
  }
  return out;
}
function rowsToAwards(grid){
  const out=[];
  for(let r=2;r<grid.length;r++){
    const x=grid[r]||[]; const g=i=>String(x[i]??"").trim();
    if(!g(0)) continue;
    out.push(["a"+r,{title:g(0),author:g(1),novel:truthy(g(2)),novella:truthy(g(3)),
      hYear:g(4),hNom:truthy(g(5)),hWin:truthy(g(6)),nYear:g(7),nNom:truthy(g(8)),nWin:truthy(g(9)),
      onList:truthy(g(14)),read:truthy(g(15))}]);
  }
  return out;
}
function rowsToGC(grid){
  let h=grid.findIndex(r=>String((r||[])[0]||"").trim()==="Title"); if(h<0) return [];
  const out=[];
  for(let r=h+1;r<grid.length;r++){
    const x=grid[r]||[]; const g=i=>String(x[i]??"").trim(); if(!g(0)) continue;
    out.push(["g"+r,{title:g(0),author:g(1),year:g(2),category:g(3),votes:num(g(4)),pct:g(5),standalone:g(6),winner:truthy(g(7)),onList:truthy(g(8)),read:g(9),comment:g(10)}]);
  }
  return out;
}

function parsePlans(grid){
  const months={};
  for(let r=0;r<grid.length;r++){
    const row=grid[r]||[];
    for(let c=0;c<row.length;c++){
      const k=String(row[c]??"").trim();
      if(/^\d{4}$/.test(k) && String(row[c+1]??"").trim()==="Titel"){
        const items=[];
        for(let rr=r+1; rr<grid.length; rr++){
          const rw=grid[rr]||[]; const first=String(rw[c]??"").trim();
          if(first==="SUM" || first==="") break;
          const t=String(rw[c+1]??"").trim();
          if(t && t!=="#N/A") items.push({title:t,pages:num(rw[c+2])||"",status:String(rw[c+3]??"").trim()});
        }
        months[k]=items;
      }
    }
  }
  return months;
}
function parseHist(grid){
  const out={books:{},pages:{}}; let mode=null, years=[];
  for(const row of grid){
    const a=String((row||[])[0]??"").trim();
    if(a==="Böcker"||a==="Sidor"){ mode=a==="Böcker"?"books":"pages"; years=row.map(x=>/^\d{4}$/.test(String(x).trim())?String(x).trim():null); continue; }
    const mi=MON_EN.indexOf(a);
    if(mode && mi>=0){
      row.forEach((v,i)=>{ const y=years[i]; if(y && String(v).trim()!==""){ (out[mode][y] ||= Array(12).fill(0))[mi]=num(v); } });
    }
  }
  return out;
}
function chunkify(prefix, pairs){
  const docs={};
  pairs.forEach(([id,item],i)=>{ const d=prefix+"_"+String(Math.floor(i/CHUNK)).padStart(2,"0"); (docs[d] ||= {items:{}}).items[id]=item; });
  return docs;
}
async function runImport(){
  const st = S.importing = {step:"Läser från Google Sheets …", err:null}; render();
  try{
    const ranges=["TBR!A1:Z3000","Novella!A1:Z2000","Removed!A1:Z2000","Series!A1:M3000","'H&N'!A1:P3000","Plan!A1:CL2000","Statistik!A1:P40","'Goodreads Choice'!A1:K1000"];
    const got=[];
    for(const r of ranges){ st.step="Läser "+r.split("!")[0].replace(/'/g,"")+" …"; render(); got.push(await getRange(r)); }
    const [tbr,nov,rem,ser,hn,plan,stat,gcg]=got;
    const books=[...rowsToBooks(tbr,"bok","t"),...rowsToBooks(nov,"novella","n"),...rowsToBooks(rem,"removed","r")];
    if(!books.length) throw {code:"empty"};
    // Keep ratings already set in the app, matched by title + author.
    const keep={}; S.books.forEach(b=>{ if(b.rating) keep[norm(b.title)+"|"+norm(b.author)]=b.rating; });
    books.forEach(([,b])=>{ const k=norm(b.title)+"|"+norm(b.author); if(keep[k]) b.rating=keep[k]; });
    const docs={...chunkify("books",books),...chunkify("series",rowsToSeries(ser)),...chunkify("awards",rowsToAwards(hn)),...chunkify("gc",rowsToGC(gcg))};
    // Keep genres and rating answers set in the app.
    const keepG={}; S.books.forEach(b=>{ const k=norm(b.title)+"|"+norm(b.author); if(b.genres||b.ratingForm||b.moreAuthor) keepG[k]={genres:b.genres,ratingForm:b.ratingForm,moreAuthor:b.moreAuthor}; });
    books.forEach(([,b])=>{ const k=norm(b.title)+"|"+norm(b.author); if(keepG[k]){ if(keepG[k].genres) b.genres=keepG[k].genres; if(keepG[k].ratingForm) b.ratingForm=keepG[k].ratingForm; if(keepG[k].moreAuthor) b.moreAuthor=keepG[k].moreAuthor; } });
    docs.plans={months:parsePlans(plan)};
    const now=new Date();
    docs.meta={importedAt:now.toISOString(), histUntil:now.getFullYear()*12+now.getMonth()-1, hist:parseHist(stat)};
    const ids=Object.keys(docs); let i=0;
    for(const id of ids){
      st.step="Sparar "+(++i)+" av "+ids.length+" …"; render();
      await S.db.doc("lib/"+id).set(docs[id]);
    }
    for(const old of Object.keys(S.docs)) if(!docs[old]) await S.db.doc("lib/"+old).delete();
    S.importing=null; toast("Klart! "+books.length+" böcker importerade."); location.hash="#bocker"; render();
  }catch(e){
    const c=e&&e.code;
    st.err = c==="empty" ? "Hittade inga böcker i fliken TBR. Kontrollera att arket heter som förut."
      : c==="server_not_connected" ? "Google Sheets är inte anslutet. Lägg till det under Customize → Connectors på claude.ai och försök igen."
      : c==="needs_reauth" ? "Google Sheets behöver anslutas på nytt. Gör det under Customize → Connectors på claude.ai."
      : (c==="not_in_manifest"||c==="approval_required"||c==="consent_required") ? "Appen fick inte läsa från Google Sheets. Tryck på Importera igen och välj Tillåt."
      : c==="tool_error" ? "Google Sheets svarade med ett fel: "+(e.message||"")
      : c==="quota_exceeded" ? "Databasen är full."
      : "Importen misslyckades ("+(c||"okänt fel")+"). Försök igen om en stund.";
    render();
  }

function filteredBooks(){
  const f=S.f; const q=norm(f.q); const AMall=authorMore(); const AM=f.auth?AMall:{};
  const serNext=(f.nextSer||f.sort==="plan")?seriesNextMap():{}; const planT=new Set((S.plans[yymm(new Date())]||[]).map(i=>norm(i.title)));
  let list=S.books.filter(b=>{
    if(phase(b)==="dnf") return false;
    if(f.avail && !AVAILABLE.includes(b.status)) return false;
    if(f.libby && !(b.libby==="ja" && isEpubOrUnknown(b))) return false;
    if(f.genre && !genresOf(b).includes(f.genre)) return false;
    if(f.lang && langName(b.lang)!==f.lang) return false;
    if(f.maxPages && !(+b.pages && +b.pages<=+f.maxPages)) return false;
    if(f.gender && b.gender!==f.gender) return false;
    if(f.nextSer && !serNext[norm(b.title)]) return false;
    if(f.phase==="unreleased"){ if(!(phase(b)==="tbr" && isUnreleased(b))) return false; }
    else if(f.phase==="backlog"){ if(!isBacklog(b)) return false; }
    else if(f.phase==="tbr"){ if(phase(b)!=="tbr" || isUnreleased(b)) return false; }
    else if(f.phase && phase(b)!==f.phase) return false;
    if(f.status && ((b.status||"")!==f.status || ["read","dnf"].includes(phase(b)))) return false;
    if(f.kind && kindOf(b)!==f.kind) return false;
    if(f.ser==="in" && !seriesOf(b)) return false;
    if(f.ser==="noname" && !(b.num && !b.series && !seriesTabFor(b))) return false;
    if(f.ser==="none" && (seriesOf(b)||b.num)) return false;
    if(f.auth){ const v=AM[authorKey(b.author)]; if(f.auth==="more" && !(v>=4)) return false; if(f.auth==="less" && !(v && v<=2)) return false; }
    if(q && !norm(b.title+" "+b.author+" "+(b.series||"")+" "+(b.comment||"")+" "+genresOf(b).join(" ")).includes(q)) return false;
    return true;
  });
  const score=b=>(planT.has(norm(b.title))?100:0)+(serNext[norm(b.title)]?50:0)+(AVAILABLE.includes(b.status)?20:0)+(b.libby==="ja"?10:0)+((AMall[authorKey(b.author)]||3)-3)*10+(b.reread?5:0);
  if(!sortOk(f.sort,f.phase)) f.sort=f.phase==="read"?"read":"plan";
  const by={plan:score, short:b=>-(+b.pages||9999), old:b=>"~"+String(b.added||"9"), added:b=>b.added||"",read:b=>b.read||b.started||"",title:b=>norm(b.title),author:b=>norm(b.author),pages:b=>+b.pages||0,year:b=>+b.year||0,rating:b=>ratingOf(b)}[f.sort];
  const desc=["added","read","pages","year","rating","plan","short"].includes(f.sort);
  list.sort((a,b)=>{ const x=by(a),y=by(b); return (x<y?-1:x>y?1:0)*(desc?-1:1); });
  if(f.phase==="unreleased"){ const rk=b=>relDate(b)||(b.year?b.year+"-12-31":"9999"); list.sort((a,b)=>rk(a).localeCompare(rk(b))); }
  if(f.sort==="old") list.sort((a,b)=>String(a.added||"9").localeCompare(String(b.added||"9")));
  if(S.pickId){ const i=list.findIndex(b=>b.id===S.pickId); if(i>0) list.unshift(list.splice(i,1)[0]); }
  return list;
}

/* --- book lookups (ISBN, covers) --- */
async function fetchJson(u){ const r=await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
function httpsUrl(u){ return u ? String(u).replace(/^http:/,"https:").replace("&edge=curl","") : ""; }
async function lookupIsbn(isbn){
  try{ const d=await fetchJson("https://openlibrary.org/api/books?bibkeys=ISBN:"+isbn+"&format=json&jscmd=data");
    const v=d["ISBN:"+isbn];
    if(v) return {title:v.title||"", author:(v.authors||[]).map(a=>a.name).join(", "), pages:v.number_of_pages||"", year:((v.publish_date||"").match(/\d{4}/)||[""])[0], lang:"", coverUrl:v.cover&&v.cover.medium||""}; }catch(_){}
  try{ const d=await fetchJson("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn);
    const v=d.items&&d.items[0]&&d.items[0].volumeInfo;
    if(v) return {title:v.title||"", author:(v.authors||[]).join(", "), pages:v.pageCount||"", year:(v.publishedDate||"").slice(0,4), lang:v.language?langName(v.language):"", coverUrl:httpsUrl(v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail))}; }catch(_){}
  try{ const d=await fetchJson("https://libris.kb.se/xsearch?query=isbn:"+isbn+"&format=json&n=1");
    const v=d.xsearch&&d.xsearch.list&&d.xsearch.list[0];
    if(v){ const cr=[].concat(v.creator||[])[0]||""; const m=String(cr).match(/^([^,]+),\s*([^,\d]+)/);
      return {title:String(v.title||"").split(" / ")[0], author:m?(m[2].trim()+" "+m[1].trim()):cr, pages:"", year:String([].concat(v.date||[])[0]||"").match(/\d{4}/)?.[0]||"", lang:v.language==="swe"?"Svenska":"", coverUrl:""}; } }catch(_){}
  return null;
}
function volToResult(v){ return {title:v.title||"", author:(v.authors||[]).join(", "), pages:v.pageCount||"", year:(v.publishedDate||"").slice(0,4), lang:v.language?langName(v.language):"", isbn:((v.industryIdentifiers||[]).find(x=>x.type==="ISBN_13")||(v.industryIdentifiers||[])[0]||{}).identifier||"", coverUrl:httpsUrl(v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail))}; }
async function searchBooks(q){
  const digits=q.replace(/[^0-9Xx]/g,"");
  if((digits.length===10||digits.length===13) && /^[\d\sXx-]+$/.test(q.trim())){ const r=await lookupIsbn(digits); return r?[{...r,isbn:digits}]:[]; }
  let out=[];
  try{ const d=await fetchJson("https://openlibrary.org/search.json?limit=10&fields=title,author_name,first_publish_year,number_of_pages_median,cover_i,isbn,language&q="+encodeURIComponent(q));
    out=(d.docs||[]).map(x=>({title:x.title, author:(x.author_name||[]).join(", "), year:x.first_publish_year||"", pages:x.number_of_pages_median||"", lang:(x.language||[]).length===1?langName(x.language[0]):"", isbn:"", coverUrl:x.cover_i?"https://covers.openlibrary.org/b/id/"+x.cover_i+"-M.jpg":""})); }catch(_){}
  if(!out.length){ try{ const d=await fetchJson("https://www.googleapis.com/books/v1/volumes?maxResults=10&printType=books&q="+encodeURIComponent(q));
    out=(d.items||[]).map(it=>volToResult(it.volumeInfo||{})).filter(r=>r.title); }catch(_){} }
  // Drop duplicate editions: keep the first hit per title + author.
  const seen=new Set(); return out.filter(r=>{ const k=norm(r.title)+"|"+norm(r.author); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,6);
}

  readForm(); S.found="loading"; renderModal();

}

  S.found=null; renderModal(); toast("Ifyllt. Kolla uppgifterna och tryck Spara.");

async function isbnLookup(){
  readForm(); const isbn=String(S.edit.isbn||"").replace(/[^0-9Xx]/g,"");
  if(isbn.length!==10 && isbn.length!==13){ toast("Skriv ett ISBN med 10 eller 13 siffror."); return; }
  toast("Söker …");
  const r=await lookupIsbn(isbn);

  for(const k of ["title","author","pages","year","lang","coverUrl"]) if(!e[k] && r[k]) e[k]=k==="pages"||k==="year"?(+r[k]||""):r[k];

  readForm();

    ?b wdt:P50 ?a. ?a rdfs:label ?al. FILTER(CONTAINS(LCASE(STR(?al)), "${sur}"))

    OPTIONAL { ?b wdt:P155 ?prev } OPTIONAL { ?b wdt:P156 ?next }

async function findSeriesGaps(){
  if(gapRun || !S.db || !S.loaded || S.isOwner===false) return; gapRun=true;
  const cs=S.docs.cleanState||{}; const chk=cs.serChecked3||{}; const today=todayISO();
  const old=d=>!d || (Date.parse(today)-Date.parse(d))/864e5>30;
  const groups=seriesGroups().filter(g=>!isAbandoned(g.name) && old(chk[g.name.toLowerCase()])).slice(0,24);
  const checked={}, gaps={};
  for(let i=0;i<groups.length;i+=6){
    const part=groups.slice(i,i+6);
    const varOf={}; part.forEach(g=>seriesNameVariants(g.name).forEach(v=>varOf[norm(v)]=g.name));
    const vals=Object.keys(varOf).length?part.flatMap(g=>seriesNameVariants(g.name).flatMap(v=>["en","sv","mul"].map(l=>JSON.stringify(v)+"@"+l))).join(" "):"";
    const q=`SELECT ?name ?m ?ord ?date ?parts ?te ?ts ?al WHERE { VALUES ?name { ${vals} }
      FILTER NOT EXISTS { ?m wdt:P31 ?tv . VALUES ?tv { wd:Q21191270 wd:Q3464665 wd:Q5398426 wd:Q11424 wd:Q7889 wd:Q24862 wd:Q1259759 wd:Q838795 wd:Q25379 } }
      { ?s rdfs:label ?name . ?st ps:P179 ?s . ?m p:P179 ?st . OPTIONAL { ?st pq:P1545 ?ord } OPTIONAL { ?s wdt:P1114 ?parts } }
      OPTIONAL { ?m wdt:P577 ?date } OPTIONAL { ?m rdfs:label ?te FILTER(LANG(?te)="en") } OPTIONAL { ?m rdfs:label ?ts FILTER(LANG(?ts)="sv") }
      OPTIONAL { ?m wdt:P50 ?a . ?a rdfs:label ?al FILTER(LANG(?al)="en") } }`;
    let d; try{ d=await fetchJson("https://query.wikidata.org/sparql?format=json&query="+encodeURIComponent(q)); }catch(_){ break; }
    const rows=d.results.bindings||[];
    for(const g of part){
      checked[g.name.toLowerCase()]=today;
      const surs=new Set(g.items.map(it=>{ const sa=splitAuthor(String(it.author||"")); return sa?norm(sa.last).split(" ").pop():""; }).filter(Boolean));
      if(!surs.size) continue;
      const mine=rows.filter(r=>varOf[norm(r.name.value)]===g.name && r.al && [...surs].some(x=>norm(r.al.value).includes(x)));
      if(!mine.length) continue;
      const mem={}; let parts=0;
      mine.forEach(r=>{ const k=r.m.value; const e=(mem[k] ||= {}); if(r.ord) e.num=firstNum(r.ord.value); if(r.date) e.date=(e.date&&e.date<r.date.value)?e.date:r.date.value;
        if(r.te) e.te=r.te.value; if(r.ts) e.ts=r.ts.value; if(r.parts) parts=Math.max(parts,+r.parts.value||0); });
      const byT={}; Object.values(mem).filter(e=>e.te||e.ts).forEach(e=>{ const k=norm(e.te||e.ts); const o=byT[k];
        if(!o || (!o.num && e.num) || (!!o.num===!!e.num && String(e.date||"")>String(o.date||""))) byT[k]=e; });
      let list=Object.values(byT);

      const haveT=new Set(g.items.flatMap(it=>[norm(it.title), norm(String(it.title).split(":")[0])]));
      const haveN=new Set(g.items.map(it=>String(it.num||"")).filter(Boolean));
      const author=g.author.split(",")[0]||"";
      list.forEach(e=>{ const titles=[e.te,e.ts].filter(Boolean); if(titles.some(t=>haveT.has(norm(t))||haveT.has(norm(t.split(":")[0]))) || haveN.has(e.num)) return;

  }
  gapRun=false;
}

/* --- clean-up --- */
function splitAuthor(a){
  a=String(a||"").trim().replace(/\s+/g," ").replace(/\s*;\s*/g,", "); if(!a || / och | and |&|\//i.test(a)) return null;
  if(a.includes(",")){ const [l,f]=a.split(",").map(x=>x.trim()); if(!f || (l.includes(" ") && f.includes(" ")) || f.split(" ").length>2) return null; return {last:l, init:(f||"").charAt(0)}; }
  const p=a.split(" "); if(p.length<2) return null; return {last:p[p.length-1], init:p[0].charAt(0)};
}
function cleanIssues(){
  if(cleanIssues._v===S.books && cleanIssues._r) return cleanIssues._r;
  const groups=[];
  // 1. Same author written in different ways
  const byKey={};
  S.books.forEach(b=>{ const sa=splitAuthor(b.author); if(!sa) return; const k=norm(sa.last)+"|"+sa.init.toLowerCase(); (byKey[k] ||= new Map()); const m=byKey[k]; m.set(b.author,(m.get(b.author)||0)+1); });
  const authors=[];
  const abbrev=v=>v.includes(",") || /^([A-ZÅÄÖ]\.?\s?)+\s/.test(v.trim()) ;
  const ws=v=>v.replace(/[\s.]+/g,"").toLowerCase();
  for(const m of Object.values(byKey)){ if(m.size<2) continue; const vars=[...m.keys()];
    // Only treat as the same person if one form is abbreviated, or they differ only in spaces/dots.
    const full=vars.filter(v=>!abbrev(v)); if(full.length>1 && new Set(full.map(ws)).size>1) continue;
    const canon=vars.slice().sort((x,y)=>(x.includes(",")-y.includes(","))||(y.replace(/\s+/g," ").length-x.replace(/\s+/g," ").length))[0].replace(/\s+/g," ").trim();
    authors.push({canon, vars:vars.filter(v=>v!==canon), n:[...m.values()].reduce((a,b)=>a+b,0)}); }
  // also double spaces in a single variant
  S.books.forEach(b=>{ const c=String(b.author||"").replace(/\s+/g," ").trim(); if(c!==b.author && !authors.some(x=>x.vars.includes(b.author))) authors.push({canon:c, vars:[b.author], n:1}); });
  groups.push({key:"authors", title:"Samma författare skriven på olika sätt", count:authors.length, items:authors});
  // 2. Series number without series name
  const noname=S.books.filter(b=>b.num && !seriesOf(b));
  groups.push({key:"noname", title:"Serienummer men inget serienamn", count:noname.length, books:noname});
  // 3. Possible duplicates
  const dup={}; S.books.forEach(b=>{ const sa=splitAuthor(b.author); const k=norm(b.title)+"|"+(sa?norm(sa.last):norm(b.author)); (dup[k] ||= []).push(b); });
  const dups=Object.entries(dup).filter(([k,l])=>l.length>1 && !(S.ignoreDups||{})[k]).map(([k,l])=>Object.assign(l,{key:k}));
  groups.push({key:"dups", title:"Möjliga dubbletter", count:dups.length, dups});
  // 4. Loans without return date
  const nodue=S.books.filter(b=>LOAN_ST.includes(b.status) && isEpubOrUnknown(b) && !b.due && phase(b)!=="read" && phase(b)!=="dnf");
  groups.push({key:"nodue", title:"Lånade böcker utan återlämningsdatum", count:nodue.length, books:nodue});
  // 5. Missing basics
  const nopages=S.books.filter(b=>!b.pages && !(+b.year>new Date().getFullYear()));
  groups.push({key:"nopages", title:"Saknar sidantal", count:nopages.length, books:nopages});
  const nolang=S.books.filter(b=>!b.lang); groups.push({key:"nolang", title:"Saknar språk", count:nolang.length, books:nolang});
  const nogender=S.books.filter(b=>!b.gender); groups.push({key:"nogender", title:"Saknar författarens kön", count:nogender.length, books:nogender});
  const epubClash=S.books.filter(b=>/^\s*epub\.?\s*$/i.test(b.comment||"") && b.format && String(b.format).trim().toUpperCase()!=="EPUB");
  groups.push({key:"epub", title:"Kommentaren säger EPUB men Format säger något annat", count:epubClash.length, books:epubClash});
  const known=new Set(Object.values(LANGS).map(v=>v.toLowerCase()));
  const oddLang=S.books.filter(b=>[b.lang,b.origLang].some(v=>v && !known.has(String(v).toLowerCase())));
  groups.push({key:"oddlang", title:"Språk som appen inte känner igen", count:oddLang.length, books:oddLang});
  // 6. Titles changed automatically (review)
  const changed=S.books.filter(b=>b.titleOrig && b.titleOrig!==b.title);
  groups.push({key:"titles", title:"Titlar som skrevs om automatiskt", count:0, review:changed.length, books:changed});
  const IG=S.cleanIgnore||{};
  groups.forEach(g=>{ if(g.books && !["dups","titles"].includes(g.key)){ g.books=g.books.filter(b=>!IG["i:"+g.key+":"+b.id]); g.count=g.books.length; } });
  cleanIssues._v=S.books; cleanIssues._r=groups; return groups;
}
function mergePlan(list, mode){
  const score= (mode==="done"||mode==="once")
    ? (b=>(b.read?10:0)+(b.kind==="removed"?-5:0)+Object.values(b).filter(v=>v!==""&&v!=null).length*0.01)
    : (b=>(b.kind==="removed"?-10:0)+(["tbr","reading"].includes(phase(b))?5:0)+Object.values(b).filter(v=>v!==""&&v!=null).length*0.01);
  // The TBR tab wins over the retired Novella/Removed tabs.
  const isTbr=b=>b.kind!=="novella" && b.kind!=="removed";
  const sorted=list.slice().sort((a,b)=>(isTbr(b)-isTbr(a))||(score(b)-score(a))); const t=sorted[0], others=sorted.slice(1);
  const reads=[]; list.forEach(b=>{ (b.reads||[]).forEach(r=>{ if(r&&r.read) reads.push(r); }); if(b.read) reads.push({started:b.started||"",read:b.read}); });
  const uniq=[...new Map(reads.map(r=>[r.read,r])).values()].sort((a,b)=>a.read.localeCompare(b.read));
  const patch={};
  for(const k of ["author","gender","lang","origLang","year","pages","series","num","source","format","rating","moreAuthor"].concat((mode==="done"||mode==="once")?[]:["due","status"])){ if(!t[k]){ const o=others.find(x=>x[k]); if(o) patch[k]=o[k]; } }
  if(!t.ratingForm || !Object.keys(t.ratingForm).length){ const o=others.find(x=>x.ratingForm&&Object.keys(x.ratingForm).length); if(o) patch.ratingForm=o.ratingForm; }
  const comments=[...new Set(list.map(b=>b.comment).filter(Boolean))]; if(comments.length>1) patch.comment=comments.join(" · ");
  const adds=list.map(b=>b.added).filter(Boolean).sort(); if(adds[0] && adds[0]!==t.added) patch.added=adds[0];
  let text;
  if(mode==="once" && uniq.length){ const own=t.read?{started:t.started||"",read:t.read}:uniq[uniq.length-1]; patch.read=own.read; patch.started=own.started||""; patch.reads=[]; patch.reread=false; if(["Lånad","On hold","Suspended","Waitlist","Ska lånas","Ska köpas","Kanske","Backlog"].includes(t.status)) patch.status=""; if(t.kind==="removed") patch.kind="bok"; text="Läst en gång"; }
  else if(mode==="done" && uniq.length){ const last=uniq[uniq.length-1]; patch.read=last.read; patch.started=last.started||t.started||""; patch.reads=uniq.slice(0,-1); patch.reread=false; if(["Lånad","On hold","Suspended","Waitlist","Ska lånas","Ska köpas","Kanske","Backlog"].includes(t.status)) patch.status=""; if(t.kind==="removed") patch.kind="bok"; text="Färdigläst"; }
  else if(!t.read && uniq.length){ patch.reads=uniq; patch.reread=true; text=`Läst ${uniq.map(r=>fmtDate(r.read)).join(", ")} och finns också bland Att läsa. Blir en bok som är markerad "läsa om", och den tidigare läsningen räknas fortfarande i statistiken.`; }
  else if(t.read){ const last=uniq[uniq.length-1]; patch.read=last.read; patch.started=last.started; patch.reads=uniq.slice(0,-1); text=uniq.length>1?`Läst ${uniq.length} gånger (${uniq.map(r=>fmtDate(r.read)).join(", ")}). Blir en bok med alla läsningar.`:`Samma bok ${list.length} gånger. Blir en.`; }
  else text=`Samma bok ${list.length} gånger. Blir en, och uppgifter som bara finns i den ena följer med.`;
  return {keep:t, patch, del:others.map(o=>o.id), text};
}
function cleanProposals(){
  if(cleanProposals._v===S.books && cleanProposals._r) return cleanProposals._r;
  const out=[]; const g=cleanIssues();
  g.find(x=>x.key==="authors").items.forEach((a,i)=>{
    const patches={}; S.books.forEach(b=>{ if(a.vars.includes(b.author)) patches[b.id]={author:a.canon}; });
    out.push({id:"au"+i, key:"p:au:"+a.canon+"|"+a.vars.join("|"), group:"authors", title:a.canon, detail:"ersätter "+a.vars.map(v=>"“"+v+"”").join(", "), patches});
  });
  g.find(x=>x.key==="dups").dups.forEach(l=>{
    out.push({id:"du:"+l.key, group:"dups", title:l[0].title+" · "+l[0].author, dupList:l, dupKey:l.key, anyRead:l.some(everRead), bookId:l[0].id});

  Object.values(S.authorFix||{}).forEach(a=>{ const sa=splitAuthor(a); if(!sa) return; const k=norm(sa.last).split(" ").pop()+"|"+sa.init.toLowerCase(); if(!full[k]) full[k]=a; });
  const nameGroups={};
  S.books.forEach(b=>{ if(covered.has(b.id)) return; const a=String(b.author||"").trim(); const single=!a.includes(" ") && a.length>1 && a!=="(red)";
    const sa=/[,;]/.test(a)?splitAuthor(a):null; if(!sa && !single) return;
    const target=(sa && full[norm(sa.last).split(" ").pop()+"|"+sa.init.toLowerCase()]) || (S.authorFix||{})[b.id];
    if(target && target!==a){ const k=a+"→"+target; (nameGroups[k] ||= {from:a,to:target,ids:[]}).ids.push(b.id); } });
  Object.values(nameGroups).forEach((g,i)=>{ const patches={}; g.ids.forEach(id=>patches[id]={author:g.to}); out.push({id:"nm"+i, key:"p:nm:"+g.from+"→"+g.to, group:"names", title:g.to, detail:"ersätter “"+g.from+"” · "+g.ids.length+(g.ids.length>1?" böcker":" bok"), patches}); });
  S.books.filter(b=>b.wdSeries && !seriesOf(b) && !b.notSeries && (b.wdSeries.src==="P179" || !b.seriesTried2)).forEach(b=>{ const w=b.wdSeries; const nm=fixSeriesName(w.name,b.lang);
    out.push({id:"wd"+b.id, key:"p:wd:"+b.id, group:"wdseries", title:b.title, detail:`${nm}${(b.num||w.num)?" #"+firstNum(b.num||w.num):""} (Wikidata)`, patches:{[b.id]:{series:nm, num:firstNum(b.num||w.num||"")}}, bookId:b.id}); });
  { const SG={...GR_GAPS, ...((S.docs.cleanState&&S.docs.cleanState.serGaps3)||{})}; const grp={}; seriesGroups().forEach(g=>grp[g.name.toLowerCase()]=g);
    const grNum=new Set(Object.values(GR_GAPS).map(x=>norm(x.series)+"|"+x.num));
    Object.entries(SG).forEach(([k,x])=>{ if(!x) return; if(!GR_GAPS[k] && grNum.has(norm(x.series)+"|"+x.num)) return; const g=grp[String(x.series).toLowerCase()]; if(g && x.title!=="?" && g.items.some(it=>norm(it.title)===norm(x.title))) return;
      if(g && x.title==="?" && g.items.some(it=>String(it.num)===String(x.num))) return;
      out.push({id:"sg:"+k, key:"p:sg:"+k, group:"sermissing", title:x.title==="?"?`${x.series} #${x.num}`:x.title,
        detail:x.title==="?"?"Titel inte känd än (Wikidata)":`${x.series} #${x.num}${x.release?" · släpps "+fmtDate(x.release):x.year?" · "+x.year:""} · ${x.author} (${x.src||"Wikidata"})`, patches:{}, adds:[x]}); }); }
  const byA={}; S.books.forEach(b=>{ (byA[authorKey(b.author)] ||= []).push(b); });
  S.books.filter(b=>!b.gender).forEach(b=>{ const v=[...new Set((byA[authorKey(b.author)]||[]).map(x=>x.gender).filter(Boolean))];
    if(v.length===1) out.push({id:"ge"+b.id, key:"p:ge:"+b.id, group:"gender", title:b.title, detail:`${GENDER[v[0]]||v[0]}, som dina andra böcker av ${b.author}`, patches:{[b.id]:{gender:v[0]}}, bookId:b.id}); });
  S.books.filter(b=>!b.lang).forEach(b=>{ const v=[...new Set((byA[authorKey(b.author)]||[]).map(x=>langName(x.lang)).filter(Boolean))];

async function cleanIgnore(keys){

async function applyProposals(which, alsoTbr){
  const skip=S.cleanSkip||new Set();
  const ch=S.dupChoice||{};
  const list=cleanProposals().filter(p=>(p.group==="dups"?!!ch[p.id]:!skip.has(p.id)) && (which==="all"||p.group===which));
  const patches={}; const ignore={};
  for(const p of list){
    if(p.group==="dups"){
      const c=ch[p.id]; if(c==="keep"){ ignore[p.dupKey]=true; continue; }
      const m=mergePlan(p.dupList, c); p.patches={[m.keep.id]:m.patch}; m.del.forEach(id=>p.patches[id]=null);
    }
    for(const [id,pt] of Object.entries(p.patches)){ if(pt===null || patches[id]===null) patches[id]=null; else patches[id]={...(patches[id]||{}), ...pt}; }
    }
  if(Object.keys(ignore).length){ try{ const cur={...(S.ignoreDups||{}), ...ignore}; await queued("cleanState",()=>S.db.doc("lib/cleanState").update({ignoreDups:cur})); }catch(e){ dbFail(e); return; } }
  const adds=list.flatMap(p=>p.adds||[]);
  if(adds.length){
    try{ for(const x of adds){
        await putItem("series", uid("s"), {title:x.title, author:x.author, series:x.series, num:x.num, year:x.year||"", pages:"", lang:x.lang||"", inList:false, read:false, comment:x.release?"Släpps "+x.release:"", src:x.src||"Wikidata"});
        if(alsoTbr && x.title!=="?" && !findBook(x.title)){ const like=S.books.find(b=>authorKey(b.author)===authorKey(x.author));
          await putItem("books", uid("b"), {kind:"bok", title:x.title, author:x.author, gender:(like&&like.gender)||"", lang:x.lang||"", origLang:"", status:"", source:"", format:"", started:"", read:"", due:"", comment:"",
            year:x.year?+x.year:"", pages:"", series:x.series, num:x.num, rating:0, extra:{}, genres:(like&&like.genres)||[], ratingForm:{}, moreAuthor:0, added:todayISO(), release:x.release||"", ownPick:true}); } }
      await queued("cleanState",()=>S.db.doc("lib/cleanState").update({ignore:Object.fromEntries(list.filter(p=>p.adds).map(p=>[p.key,true]))}));
      S.cleanIgnore={...(S.cleanIgnore||{}), ...Object.fromEntries(list.filter(p=>p.adds).map(p=>[p.key,true]))}; cleanProposals._r=null;
    }catch(e){ dbFail(e); return; }
    if(!Object.keys(patches).length){ toast(adds.length+(adds.length===1?" bok tillagd":" böcker tillagda")+" i Serier"+(alsoTbr?" och bland Att läsa.":".")); render(); return; }
  }
  if(!Object.keys(patches).length && !Object.keys(ignore).length){ toast("Inget att godkänna."); return; }
  if(!Object.keys(patches).length || await batchUpdate(patches)){ S.dupChoice={}; toast(list.length+" ändringar genomförda."); }
}

/* --- stats --- */
function monthCounts(){
  // books[y][m], pages[y][m]; history from the sheet up to import month, books' own dates after.
  const books={}, pages={};
  const hist=(S.meta&&S.meta.hist)||{books:{},pages:{}}; const until=S.meta?S.meta.histUntil:-1;
  for(const [y,arr] of Object.entries(hist.books||{})) arr.forEach((v,m)=>{ if(+y*12+m<=until) (books[y] ||= Array(12).fill(0))[m]=v; });
  for(const [y,arr] of Object.entries(hist.pages||{})) arr.forEach((v,m)=>{ if(+y*12+m<=until) (pages[y] ||= Array(12).fill(0))[m]=v; });
  const nov={};
  for(const b of S.books){
    if(phase(b)==="dnf") continue;
    for(const d of allReads(b)){
      const m=String(d).match(/^(\d{4})-(\d{2})/); if(!m) continue;
      const y=+m[1], mo=+m[2]-1; const key=y*12+mo;
      if(kindOf(b)==="novella") (nov[y] ||= Array(12).fill(0))[mo]++;
      if(hist.books && hist.books[y] && key<=until) continue;
      (books[y] ||= Array(12).fill(0))[mo]++; (pages[y] ||= Array(12).fill(0))[mo]+=(+b.pages||0);
    }
  }
  // Novellas can't exceed the month's total (older months come from the sheet's totals).
  for(const [y,arr] of Object.entries(nov)) arr.forEach((v,m)=>{ arr[m]=Math.min(v,(books[y]||[])[m]||0); });
  return {books,pages,nov};
}
function vbars(data, opts={}){
  const W=600,H=opts.h||200,P={l:36,r:6,t:14,b:24};
  const max=Math.max(1,...data.map(d=>d.v)); const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const bw=(W-P.l-P.r)/data.length; const y=v=>H-P.b-(v/top)*(H-P.t-P.b);
  let g="";
  for(let v=0; v<=top; v+=step){ g+=`<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${P.l-6}" y="${y(v)+4}" text-anchor="end">${fmtN(v)}</text>`; }
  const every=Math.ceil(data.length/14);
  data.forEach((d,i)=>{
    const x=P.l+i*bw+bw*0.18, w=bw*0.64; const n=Math.min(d.n||0,d.v), base=d.v-n;
    const tip=`${esc(d.title||d.l)}: ${fmtN(d.v)}${n?` (${fmtN(base)} ${opts.a||"romaner"}, ${fmtN(n)} ${opts.b||"noveller"})`:""}`;
    const seg=(v0,v1,cls,round)=>{ const yb=y(v0)-(v0>0?2:0), h=Math.max(0,yb-y(v1)); if(h<=0) return ""; const r=round?Math.min(4,h,w/2):0;
      return `<path class="bar ${cls}" d="M${x},${yb} v${-(h-r)} q0,${-r} ${r},${-r} h${w-2*r} q${r},0 ${r},${r} v${h-r} z"><title>${tip}</title></path>`; };
    if(d.v>0){ g+=seg(0,base,d.now?"now":"",!n); if(n) g+=seg(base,d.v,"nov"+(d.now?" now2":""),true); }
    if(i%every===0) g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"")}">${g}</svg></div>`;
}
function niceStep(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const n=raw/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function fmtN(v){ return Math.round(v).toLocaleString("sv-SE"); }
function hbars(entries, total, id){
  const max=Math.max(1,...entries.map(e=>e[1]));
  return `<div class="hbars">${entries.map(([k,v,key])=>`<div class="hbar${id?" click":""}" ${id?`data-drill="${esc(id+"|"+(key!=null?key:k))}" role="button" tabindex="0" aria-pressed="${S.statDrill===id+"|"+(key!=null?key:k)}"`:""} title="${esc(k)}: ${v}${total?` (${Math.round(v/total*100)} %)`:""}${id?" · klicka för att se böckerna":""}"><span class="lab">${esc(k)}</span><span class="track"><span class="fill" style="width:${v/max*100}%;display:block"></span></span><span class="num">${v}</span></div>`).join("")}</div>`;
}
function tally(list, fn, limit=8, noRest=false){
  const c={}; list.forEach(b=>{ const k=fn(b); if(k) c[k]=(c[k]||0)+1; });
  let e=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  if(e.length>limit && noRest) return e.slice(0,limit);
  if(e.length>limit){ const rest=e.slice(limit-1).reduce((s,x)=>s+x[1],0); e=e.slice(0,limit-1).concat([["Övriga",rest]]); }
  return e;
}

/* --- series --- */
function seriesGroups(){
  const g={}; const readT=new Set(S.books.filter(everRead).map(b=>norm(b.title)));
  const add=(name,it)=>{ name=String(name||"").trim().replace(/\s+/g," "); if(!name || isNumLike(name)) return; name=fixSeriesName(name,it.lang); const k=name.toLowerCase();
    const grp=(g[k] ||= {name, items:[], seen:new Set()});
    const tk=norm(it.title)||("?"+it.num); if(it.title!=="?" && grp.seen.has(tk)) return; grp.seen.add(tk); grp.items.push(it); };
  S.series.forEach(x=>add(x.series,{...x, num:firstNum(x.num), unknown:String(x.title).trim()==="?", read:x.read||readT.has(norm(x.title))}));
  // Link Series-tab rows to books in the list, so titles can be opened.
  for(const grp of Object.values(g)) grp.items.forEach(it=>{ if(!it.bookId && !it.unknown){ const bk=findBook(it.title); if(bk){ it.bookId=bk.id; it.read=it.read||phase(bk)==="read"; } } });
  S.books.forEach(b=>{ const sr=seriesOf(b); if(sr) add(sr.name,{id:"book:"+b.id, bookId:b.id, lang:b.lang, title:b.title, author:b.author, num:firstNum(sr.num||b.num), year:b.year, pages:b.pages, read:phase(b)==="read", sugg:!!sr.src}); });
  return Object.values(g).map(({name,items})=>{
    items.sort((a,b)=>num(a.num)-num(b.num));
    const known=items.filter(i=>!i.unknown);
    const read=known.filter(i=>i.read).length;
    const authors=[...new Set(items.map(i=>String(i.author||"").replace(/\s+/g," ").trim()).filter(Boolean))];
    return {name,items,read,total:items.length,author:authors.join(", ")};
  });
}
function seriesView(){
  const q=norm(S.serQ);
  const all=seriesGroups();
  const st=g=>isAbandoned(g.name)?"stopped":g.read===0?"unstarted":(g.read>=g.items.filter(i=>!i.unknown).length?"done":"open");
  let groups=all.filter(g=>!q||norm(g.name+" "+g.author+" "+g.items.map(i=>i.title).join(" ")).includes(q));
  const f=S.serFilter;
  if(f!=="all") groups=groups.filter(g=>st(g)===f);
  groups.sort((a,b)=>a.name.localeCompare(b.name,"sv"));
  const c={open:0,unstarted:0,done:0,stopped:0}; all.forEach(g=>c[st(g)]++);
  const chip=(v,l,n)=>`<button class="chip" data-ser="${v}" aria-pressed="${f===v}">${l}<span class="n">${n}</span></button>`;
  const row=g=>{ const open=!!S.serOpen && S.serOpen.toLowerCase()===g.name.toLowerCase(); const nxt=g.items.find(i=>!i.read&&!i.unknown);
    return `<div class="card" style="padding:12px 14px">
      <div class="sec-h" data-seropen="${esc(g.name)}" role="button" tabindex="0" aria-expanded="${open}" style="cursor:pointer;margin:0">
        <div><h3>${esc(g.name)}${isAbandoned(g.name)?` <span class="pill ph-dnf" style="font-family:var(--body);font-size:11px">Avbruten</span>`:""}</h3><div class="muted small">${authorsLinks(g.author)}${nxt&&g.read&&!isAbandoned(g.name)?` · Nästa: ${nxt.bookId?`<button type="button" class="alink" data-book="${esc(nxt.bookId)}">${esc(nxt.title)}</button>`:esc(nxt.title)}`:""}</div></div>
        <span class="muted small" style="font-variant-numeric:tabular-nums;white-space:nowrap">${g.read} av ${g.total} ${open?"▴":"▾"}</span></div>
      <div class="prog"><i style="width:${g.total?g.read/g.total*100:0}%"></i></div>
      ${open?`<table style="margin-top:8px"><tbody>${g.items.map(i=>`<tr><td class="num" style="width:36px">${i.num?"#"+esc(i.num):""}</td><td>${i.unknown?`<span class="muted">Titel inte känd än</span>`:i.bookId?`<button type="button" class="alink" data-book="${esc(i.bookId)}">${esc(i.title)}</button>`:esc(i.title)}${i.sugg?` <span class="muted small">(förslag från Open Library)</span>`:""}<div class="muted small">${[i.year,i.pages?i.pages+" s.":""].filter(Boolean).join(" · ")}</div></td><td style="text-align:right">${i.unknown?"":i.bookId?`<button class="chip" data-book="${esc(i.bookId)}" aria-pressed="${!!i.read}">${i.read?"Läst":"Ej läst"}</button>`:`<button class="chip" data-serread="${esc(i.id)}" aria-pressed="${!!i.read}">${i.read?"Läst":"Ej läst"}</button>`}</td></tr>`).join("")}</tbody></table>
      <div class="row" style="margin-top:8px"><button class="btn small" data-abandon="${esc(g.name)}">${isAbandoned(g.name)?"Jag vill fortsätta med serien ändå":"Jag fortsätter inte med den här serien"}</button></div>`:""}
    </div>`; };
  return `<div class="row"><input type="search" id="serQ" placeholder="Sök serie, titel eller författare …" value="${esc(S.serQ)}" aria-label="Sök serie"></div>
  <div class="chips">${chip("open","Påbörjade",c.open)}${chip("unstarted","Inte påbörjade",c.unstarted)}${chip("done","Färdiga",c.done)}${chip("stopped","Avbrutna",c.stopped)}${chip("all","Alla",all.length)}</div>
  <div id="results" style="display:flex;flex-direction:column;gap:8px">${groups.length?groups.map(row).join(""):`<div class="empty">Inga serier matchar.</div>`}</div>
  <p class="muted small">Klicka på en serie för att se delarna. Serier från Series-fliken och serier du satt på böcker i appen slås ihop.</p>`;
}

/* --- next book --- */
function isAbandoned(name){ return !!(S.abandoned||{})[String(name||"").trim().toLowerCase()]; }
function seriesNextMap(){
  const m={};
  for(const g of seriesGroups()){
    if(!g.read || isAbandoned(g.name)) continue;
    const nxt=g.items.find(i=>!i.read); if(nxt) m[norm(nxt.title)]=g.name;
  }
  return m;
}
function nextView(){
  const n=S.next; const nowK=yymm(new Date());
  const planT=new Set((S.plans[nowK]||[]).map(i=>norm(i.title)));
  const serNext=seriesNextMap();
  const langs=[...new Set(S.books.filter(b=>phase(b)==="tbr"||phase(b)==="reading").map(b=>langName(b.lang)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"sv"));
  let list=S.books.filter(b=>phase(b)==="tbr");
  if(n.avail) list=list.filter(b=>AVAILABLE.includes(b.status));
  if(n.libby) list=list.filter(b=>b.libby==="ja" && isEpubOrUnknown(b));
  if(n.genre) list=list.filter(b=>genresOf(b).includes(n.genre));
  if(n.lang) list=list.filter(b=>langName(b.lang)===n.lang);
  if(n.maxPages) list=list.filter(b=>+b.pages && +b.pages<=+n.maxPages);
  if(n.kind) list=list.filter(b=>kindOf(b)===n.kind);
  if(n.gender) list=list.filter(b=>b.gender===n.gender);
  if(n.series) list=list.filter(b=>serNext[norm(b.title)]);
  list=list.filter(b=>{ const sr=seriesOf(b); return !(sr && isAbandoned(sr.name)); });
  const AM=authorMore();
  if(n.auth==="more") list=list.filter(b=>AM[authorKey(b.author)]>=4);
  if(n.auth==="hide") list=list.filter(b=>b.ownPick || !(AM[authorKey(b.author)]<=2));

    </div>

  </div>
