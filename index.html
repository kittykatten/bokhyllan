    <span class="stripe ph-${phase(b)}"></span>${coverHtml(b)}
    <div><div class="t">${b.id===S.pickId?"🎲 ":""}${esc(b.title)}</div><div class="a">${authorLink(b.author)}</div><div class="m">${esc([b.pages?b.pages+" s.":"", langName(b.lang), ...why(b)].filter(Boolean).join(" · "))}</div></div>
    <div class="r">${genresOf(b).slice(0,2).map(g=>`<span class="genre">${esc(g)}</span>`).join("")}</div></div>`).join("")}</div>`:`<div class="empty">Inga böcker matchar. Prova att ta bort ett filter.</div>`}`;
}

/* --- plan --- */
function yymm(d){ return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0"); }
function planLabel(k){ return MON_SV_LONG[+k.slice(2)-1]+" 20"+k.slice(0,2); }
function findBook(title){ const t=norm(title); return t?S.books.find(b=>norm(b.title)===t):null; }
function planView(){ return S.planKey ? planMonthView() : planYearView(); }
function planYearView(){
  const now=new Date(); const Y=S.planYear||now.getFullYear(); const nowK=yymm(now);
  const yy=String(Y).slice(2);
  let yBooks=0,yPages=0,yRead=0;
  const cards=MON_SV_LONG.map((name,i)=>{
    const k=yy+String(i+1).padStart(2,"0"); const items=S.plans[k]||[];
    let pages=0; const rows=items.map(it=>{ const b=findBook(it.title); const p=b?phase(b):"tbr"; pages+=+(b&&b.pages)||+it.pages||0; if(p==="read") yRead++; return `<li draggable="true" data-dragtitle="${esc(it.title)}" style="cursor:grab"><span class="dot ph-${p}"></span><span>${esc(it.title)}</span></li>`; });
    yBooks+=items.length; yPages+=pages;
    const cls=k===nowK?"now":(k<nowK?"past":"");
    return `<div class="mon ${cls}" data-planmonth="${k}" data-drop="month" role="button" tabindex="0">
      <h3>${name.charAt(0).toUpperCase()+name.slice(1)}<small>${items.length?items.length+" st · "+fmtN(pages)+" s.":""}</small></h3>
      ${items.length?`<ul>${rows.slice(0,6).join("")}${rows.length>6?`<li class="muted">+${rows.length-6} till</li>`:""}</ul>`:`<span class="muted small">Inget planerat</span>`}
    </div>`;
  }).join("");
  return `<div class="row"><button class="btn" data-py="${Y-1}" aria-label="Föregående år">←</button><h2 class="grow" style="font-size:24px;text-align:center">${Y}</h2><button class="btn" data-py="${Y+1}" aria-label="Nästa år">→</button></div>
  <div class="tiles"><div class="tile"><div class="v">${yBooks}</div><div class="l">böcker planerade ${Y}</div></div><div class="tile"><div class="v">${fmtN(yPages)}</div><div class="l">sidor planerade</div></div><div class="tile"><div class="v">${yRead}</div><div class="l">av dem lästa</div></div></div>
  <div class="cal">${cards}</div>
  <p class="muted small">Grön prick: läst. Blå: läser. Grå: inte läst än. Klicka på en månad för att lägga till eller ta bort böcker. Dra en bok till en annan månad för att flytta den.</p>`;
}
function prevKey(k){ let y=+k.slice(0,2), m=+k.slice(2)-1; if(m<1){m=12;y--;} return String(y).padStart(2,"0")+String(m).padStart(2,"0"); }
function planMonthView(){
  const now=yymm(new Date());
  const keys=[...new Set([...Object.keys(S.plans), now])].sort();
  const k=S.planKey||now; const items=S.plans[k]||[];
  const total=items.reduce((s,i)=>{ const b=findBook(i.title); return s+(+(b&&b.pages)||+i.pages||0); },0);
  const q=norm(S.planQ||"");
  const sugg=q?S.books.filter(b=>phase(b)!=="read"&&norm(b.title+" "+b.author).includes(q)).slice(0,8):[];
  const i=keys.indexOf(k);
  return `<div class="row"><button class="btn" data-act="planback">← Hela året</button></div>
  <div class="row"><button class="btn" data-plan="${esc(prevKey(k))}" aria-label="Föregående månad">←</button>
    <h2 class="grow" style="font-size:22px;text-align:center">${esc(planLabel(k))}</h2>
    <button class="btn" data-plan="${esc(nextKey(k))}" aria-label="Nästa månad">→</button></div>
  <div class="tiles"><div class="tile"><div class="v">${items.length}</div><div class="l">böcker planerade</div></div><div class="tile"><div class="v">${fmtN(total)}</div><div class="l">sidor totalt</div></div>
    <div class="tile"><div class="v">${items.filter(i=>{const b=findBook(i.title);return b&&phase(b)==="read";}).length}</div><div class="l">lästa av dem</div></div></div>
  ${items.length?`<div class="list">${items.map((it,ix)=>{ const b=findBook(it.title); const p=b?phase(b):"tbr";
    return `<div class="item" ${b?`data-book="${esc(b.id)}" role="button" tabindex="0"`:""}><span class="stripe ph-${p}"></span>${coverHtml(b||{title:it.title})}
      <div><div class="t">${esc(it.title)}</div><div class="a">${b?authorLink(b.author):""}</div><div class="m">${[(b&&b.pages)||it.pages?((b&&b.pages)||it.pages)+" s.":"", b?b.status:it.status].filter(Boolean).join(" · ")}</div></div>
      <div class="r"><span class="pill ph-${p}">${b?PHASE_LABEL[p]:"Finns inte i listan"}</span><button class="btn small" data-planrm="${ix}">Ta bort</button></div></div>`; }).join("")}</div>`:`<div class="empty">Inget planerat för ${esc(planLabel(k))} än.</div>`}
  <div class="card"><div class="sec-h"><h3>Lägg till i planen</h3></div>
    <input type="search" id="planQ" placeholder="Sök bland olästa böcker …" value="${esc(S.planQ||"")}" style="width:100%" aria-label="Sök bok att planera">
    <div id="results">${sugg.length?`<div class="list" style="margin-top:8px">${sugg.map(b=>`<div class="item" data-planadd="${esc(b.id)}" role="button" tabindex="0"><span class="stripe ph-${phase(b)}"></span>${coverHtml(b)}<div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div></div><div class="r"><span class="pill ph-tbr">+ Lägg till</span></div></div>`).join("")}</div>`:""}</div>
  </div>`;
}
function nextKey(k){ let y=+k.slice(0,2), m=+k.slice(2)+1; if(m>12){m=1;y++;} return String(y).padStart(2,"0")+String(m).padStart(2,"0"); }

/* ---------- events ---------- */
document.addEventListener("input", e=>{
  const id=e.target.id;
  if(id==="q"){ S.f.q=e.target.value; S.f.limit=150; }
  else if(id==="serQ"||id==="awQ"||id==="planQ"){ S[id]=e.target.value; }
  else return;
  clearTimeout(refreshResults._t); refreshResults._t=setTimeout(refreshResults,180);
});
// Drag and drop: plan rows between months, and from the plan to Läser nu.
let dragInfo=null;
document.addEventListener("dragstart", e=>{ const el=e.target.closest&&e.target.closest("[data-dragtitle]"); if(!el) return; dragInfo={title:el.dataset.dragtitle, id:el.dataset.dragbook||""}; try{ e.dataTransfer.setData("text/plain", dragInfo.title); e.dataTransfer.effectAllowed="move"; }catch(_){} });
document.addEventListener("dragend", ()=>{ dragInfo=null; document.querySelectorAll(".drop-over").forEach(x=>x.classList.remove("drop-over")); });
document.addEventListener("dragover", e=>{ if(!dragInfo) return; const t=e.target.closest&&e.target.closest("[data-drop]"); if(!t) return; if(t.dataset.drop==="reading" && !dragInfo.id) return; e.preventDefault(); document.querySelectorAll(".drop-over").forEach(x=>{ if(x!==t) x.classList.remove("drop-over"); }); t.classList.add("drop-over"); });
document.addEventListener("dragleave", e=>{ const t=e.target.closest&&e.target.closest("[data-drop]"); if(t && !t.contains(e.relatedTarget)) t.classList.remove("drop-over"); });
document.addEventListener("drop", async e=>{ if(!dragInfo) return; const t=e.target.closest&&e.target.closest("[data-drop]"); if(!t) return; e.preventDefault(); t.classList.remove("drop-over"); const info=dragInfo; dragInfo=null;
  if(t.dataset.drop==="month"){ const k=t.dataset.planmonth; try{ await movePlan(info.title,k); toast(info.title+" flyttad till "+planLabel(k)+"."); }catch(_){} }
  if(t.dataset.drop==="reading" && info.id){ const b=S.books.find(x=>x.id===info.id); if(b && !b.started){ if(await batchUpdate({[b.id]:{started:todayISO(), dropped:null}})) toast("Du läser nu "+b.title+"."); } }
});
document.addEventListener("toggle", e=>{ if(e.target.matches && e.target.matches("[data-moreopen]")) S.moreOpen=e.target.open; }, true);
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="fStatus"){ S.f.status=e.target.value; if(e.target.value) S.f.phase=""; render(); }
  if(id==="fKind"){ S.f.kind=e.target.value; render(); }
  if(id==="fSort"){ S.f.sort=e.target.value; render(); }
  if(id==="fSer"){ S.f.ser=e.target.value; render(); }
  if(id==="fAuth"){ S.f.auth=e.target.value; render(); }
  if(id==="importFile" && e.target.files && e.target.files[0]){ e.target.files[0].text().then(importData); return; }
  if(id==="statYear"){ S.statYear=+e.target.value; render(); }
  if(id==="e_release" && S.edit && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value.trim())){ const a=$("#e_added"); if(a && !S.edit.read && !S.edit.started) a.value=e.target.value.trim(); }
  if((id==="e_format"||id==="e_source"||id==="e_loaned"||id==="e_status") && S.edit && e.target.value!=="__new"){ readForm(); const b=S.edit;
    if(id==="e_status"){ if(isBok(b) && (b.status==="Köpt"||b.status==="Lånad")) b.source=b.status; if(!isBok(b) && b.status==="Lokal fil") b.source="Lokal fil"; }
    if(id==="e_format" && b.source && !sourceOpts({...b,source:""}).includes(b.source) && ["Köpt","Lånad","Lokal fil"].includes(b.source)) b.source="";
    renderModal(); return; }
  if(e.target.dataset && e.target.dataset.pick && e.target.value==="__new"){
    const inpEl=document.createElement("input"); inpEl.type="text"; inpEl.id=e.target.id; inpEl.placeholder="Skriv ny …";
    e.target.replaceWith(inpEl); inpEl.focus(); return;
  }
  if(id==="gcCat"){ S.gcCat=e.target.value; render(); }
  const nmap={nAvail:["avail","checked"],nLibby:["libby","checked"],nSeries:["series","checked"],nLang:["lang","value"],nPages:["maxPages","value"],nKind:["kind","value"],nGender:["gender","value"],nSort:["sort","value"],nAuth:["auth","value"]};
  if(nmap[id]){ S.f[({series:"nextSer"})[nmap[id][0]]||nmap[id][0]]=e.target[nmap[id][1]]; S.pickId=null; render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.id==="e_find"){ e.preventDefault(); runFind(); return; }
  if(e.key==="Escape" && S.edit){ S.edit=null; S.confirmDel=false; renderModal(); }
  if((e.key==="Enter"||e.key===" ") && e.target.matches("[role=button][data-drill],[role=button][data-book],[role=button][data-planadd],[role=button][data-planmonth],[role=button][data-seropen],[role=button][data-cleanopen],[role=button][data-pickfound]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-act],[data-phase],[data-book],[data-rate],[data-scope],[data-ser],[data-serread],[data-aw],[data-plan],[data-planrm],[data-planadd],[data-q],[data-genre],[data-awsrc],[data-ng],[data-planmonth],[data-py],[data-more],[data-author],[data-af],[data-seropen],[data-cleanopen],[data-fixauthor],[data-undotitle],[data-libsave],[data-libretire],[data-abandon],[data-apply],[data-skip],[data-gotoseries],[data-dupch],[data-pickfound],[data-ignore],[data-dropf],[data-addnew],[data-drill],[data-nbinfo],[data-bl],[data-nomore],[data-apref],[data-prefreview]");
  if(!t) return;
  const d=t.dataset;
  if(d.act==="close-bg" && e.target!==t) return;
  if(d.rate!=null){ readForm(); S.edit.rating=+d.rate; renderModal(); return; }
  if(d.q){ readForm(); const a={...(S.edit.ratingForm||{})}; a[d.q]=+d.v; S.edit.ratingForm=a; S.edit.rating=formScore(a); renderModal(); return; }
  if(d.genre){ readForm(); const g=new Set(S.edit.genres||[]); g.has(d.genre)?g.delete(d.genre):g.add(d.genre); S.edit.genres=GENRES.filter(x=>g.has(x)); renderModal(); return; }
  if(d.author){ S.authorName=d.author; S.authorF=""; S.authorBack=location.hash||"#bocker"; if(S.edit){ S.edit=null; S.confirmDel=false; renderModal(); } if(location.hash==="#forfattare") render(); else location.hash="#forfattare"; $("#main").scrollTop=0; return; }
  if(d.cleanopen){ S.cleanOpen = S.cleanOpen===d.cleanopen ? null : d.cleanopen; render(); return; }
  if(d.fixauthor!=null){
    const a=cleanIssues().find(g=>g.key==="authors").items[+d.fixauthor]; if(!a) return;
    const all=[a.canon,...a.vars]; const target=all[+d.v].replace(/\s+/g," ").trim();
    const patches={}; S.books.forEach(b=>{ if(all.includes(b.author) && b.author!==target) patches[b.id]={author:target}; });
    if(await batchUpdate(patches)) toast(Object.keys(patches).length+" böcker uppdaterade."); return; }
  if(d.undotitle){ const b=S.books.find(x=>x.id===d.undotitle); if(b && await batchUpdate({[b.id]:{title:b.titleOrig, titleOrig:"", titleKeep:true}})) toast("Titeln återställd."); return; }
  if(d.gotoseries){ S.serOpen=d.gotoseries.trim(); S.serFilter="all"; S.serQ=d.gotoseries.trim(); if(S.edit){ S.edit=null; S.confirmDel=false; renderModal(); } if(location.hash==="#serier") render(); else location.hash="#serier"; $("#main").scrollTop=0; return; }
  if(d.abandon){ const k=d.abandon.trim().toLowerCase(); const ab={...(S.abandoned||{})}; if(ab[k]) delete ab[k]; else ab[k]=true;
    try{ await queued("seriesState",()=>S.db.doc("lib/seriesState").set({abandoned:ab})); toast(ab[k]?"Serien är markerad som avbruten. Dess olästa böcker föreslås inte längre i Nästa bok.":"Serien är aktiv igen."); }catch(e){ dbFail(e); } return; }
  if(d.pickfound!=null){ pickFound(+d.pickfound); return; }
  if(d.dupch){ S.dupChoice={...(S.dupChoice||{})}; S.dupChoice[d.dupch] = S.dupChoice[d.dupch]===d.v ? undefined : d.v; if(!S.dupChoice[d.dupch]) delete S.dupChoice[d.dupch]; render(); return; }
  if(d.apref){ await setAuthorPref(d.k, d.apref); return; }
  if(d.prefreview){ S.prefReview=S.prefReview===d.prefreview?"":d.prefreview; render(); return; }
  if(d.nomore){ const ids=d.ids.split(",").filter(Boolean); const patches={}; ids.forEach(id=>patches[id]={dropped:{date:todayISO(), reason:"Lockar inte längre"}});
    if(await batchUpdate(patches)){ for(const id of ids){ const b=S.books.find(x=>x.id===id); if(b){ try{ await movePlan(b.title,""); }catch(_){} } } toast(ids.length>1?ids.length+" böcker flyttade till Bortvalda.":"Flyttad till Bortvalda."); } return; }
  if(d.bl){ await backlogAct(d.bl, d.id); return; }
  if(d.addnew){ await addNewBook(d.addnew); return; }
  if(d.nbinfo){ if(S.nbOpen===d.nbinfo){ S.nbOpen=null; render(); return; } S.nbOpen=d.nbinfo; render(); const n=newBookList().find(x=>x.key===d.nbinfo); if(n){ await loadNbInfo(n); if(S.nbOpen===d.nbinfo) render(); } return; }
  if(d.drill!=null){ S.statDrill=S.statDrill===d.drill?null:d.drill; render(); setTimeout(()=>{ const el=document.getElementById("drill"); if(el&&S.statDrill) el.scrollIntoView({behavior:"smooth",block:"start"}); },50); return; }
  if(d.dropf!=null){ S.dropF=d.dropf; render(); return; }
  if(d.ignore){ await cleanIgnore(d.ignore.split("\n")); return; }
  if(d.skip){ (S.cleanSkip ||= new Set()); S.cleanSkip.has(d.skip)?S.cleanSkip.delete(d.skip):S.cleanSkip.add(d.skip); render(); return; }
  if(d.apply){ await applyProposals(d.apply, d.tbr==="1"); return; }
  if(d.libretire!=null){ const list=S.libs.map(l=>({...l})); list[+d.libretire].active=false; try{ await queued("libraries",()=>S.db.doc("lib/libraries").set({list})); toast("Flyttat till tidigare bibliotek."); }catch(e){ dbFail(e); } return; }
  if(d.libsave!=null){ const i=+d.libsave; const list=S.libs.map(l=>({...l})); const g=k=>{ const el=$("#lib_"+i+"_"+k); return el?el.value.trim():""; };
    list[i]={...list[i], holds:+g("holds")||0, loans:+g("loans")||0, days:+g("days")||0, validTo:parseDate(g("validTo"))};
    try{ await queued("libraries",()=>S.db.doc("lib/libraries").set({list})); toast("Sparat."); }catch(e){ dbFail(e); } return; }
  if(d.seropen){ S.serOpen = S.serOpen===d.seropen ? null : d.seropen; render(); return; }
  if(d.af!=null){ S.authorF=d.af; render(); return; }
  if(d.more!=null){ readForm(); S.edit.moreAuthor=+d.more; renderModal(); return; }
  if(d.awsrc){ S.awSrc=d.awsrc; render(); return; }
  if(d.ng!=null){ S.f.genre=d.ng; S.moreOpen=true; S.pickId=null; render(); return; }
  if(d.planmonth){ S.planKey=d.planmonth; render(); $("#main").scrollTop=0; return; }
  if(d.py){ S.planYear=+d.py; render(); return; }
  if(d.act){
    switch(d.act){
      case "import": runImport(); return;
      case "more": S.f.limit+=300; render(); return;
      case "new": openBook(null); return;
      case "authrename": renameAuthor(); return;
      case "authback": location.hash=(S.authorBack&&S.authorBack!=="#forfattare")?S.authorBack:"#bocker"; return;
      case "editmeta": { readForm(); S.editMeta=!S.editMeta; renderModal(); return; }
      case "useseries": { readForm(); const sr=seriesOf(S.edit); if(sr){ S.edit.series=sr.name; if(!S.edit.num && sr.num) S.edit.num=sr.num; } renderModal(); return; }
      case "usesugg": { readForm(); const sg=genreSuggest(S.edit); if(sg) S.edit.genres=sg.list.slice(); renderModal(); return; }
      case "clearrating": readForm(); S.edit.rating=0; S.edit.ratingForm={}; renderModal(); return;
      case "gcimport": importGC(); return;
      case "login": doLogin(); return;
      case "logout": signOut(AUTH); return;
      case "backup": downloadBackup(); return;
      case "importtext": { const t=$("#importText"); if(t && t.value.trim()) importData(t.value.trim()); return; }
      case "isbn": isbnLookup(); return;
      case "find": runFind(); return;
      case "scan": startScan(); return;
      case "scanstop": stopScan(); return;
      case "exportall": case "copyall": {
        const data=JSON.stringify({app:"bokhyllan", version:1, exportedAt:new Date().toISOString(), docs:S.docs});
        if(d.act==="copyall"){ try{ await navigator.clipboard.writeText(data); toast("Kopierat. Klistra in i nya appen."); }catch(_){ toast("Kunde inte kopiera. Prova Spara exportfil."); } return; }
        try{ const dl=await claude.use("downloads"); if(!dl){ toast("Nedladdning går inte här. Prova Kopiera all data."); return; }
          await dl.save({filename:"bokhyllan-export.json", data}); toast("Exportfilen är sparad."); }
        catch(_){ toast("Nedladdningen avbröts. Prova igen eller Kopiera all data."); }
        return; }
      case "serimport": importSeries(); return;
      case "planback": S.planYear=+("20"+(S.planKey||yymm(new Date())).slice(0,2)); S.planKey=null; render(); return;
      case "pick": { const ids=[...document.querySelectorAll("#main [data-book]")].map(x=>x.dataset.book); if(ids.length){ S.pickId=ids[Math.floor(Math.random()*ids.length)]; render(); $("#main").scrollTop=0; } return; }
      case "close": case "close-bg": stopScan(); S.edit=null; S.confirmDel=false; renderModal(); return;
      case "save": saveBook(); return;
      case "dropask": { readForm(); S.dropAsk=!S.dropAsk; renderModal(); return; }
      case "drop": { readForm(); const e=S.edit; e.dropped={date:todayISO(), reason:t.dataset.reason||""}; if(e.status==="Gav upp") e.status=""; e.plan=""; S.dropAsk=false;
        saveBook(true).then(()=>toast("Flyttad till Bortvalda: "+(e.dropped.reason||"")+".")); return; }
      case "undrop": { readForm(); const e=S.edit; e.dropped=null; if(e.status==="Gav upp") e.status=""; if(e.kind==="removed") e.kind="bok"; saveBook(false).then(()=>{ renderModal(); toast("Tillbaka bland Att läsa."); }); return; }
      case "reread": { readForm(); const e=S.edit; e.reads=[...(e.reads||[]), {started:e.started||"", read:e.read}]; e.started=""; e.read=""; e.reread=true; saveBook(false).then(()=>{ renderModal(); toast("Boken ligger nu bland Att läsa som omläsning. Tidigare läsning finns kvar i statistiken."); }); return; }
      case "loan": readForm(); S.edit.status="Lånad"; S.edit.loaned=todayISO(); saveBook(false).then(()=>{ renderModal(); toast(loanDays(S.edit)?"Lånad idag. Lämnas tillbaka "+fmtDate(addDaysISO(S.edit.loaned,loanDays(S.edit)))+".":"Lånad idag. Välj källa så räknas återlämningsdatumet ut."); }); return;
      case "start": readForm(); S.edit.dropped=null; S.edit.started=todayISO(); if(S.edit.status==="Gav upp") S.edit.status=""; saveBook(); return;
      case "finish": readForm(); S.edit.dropped=null; S.edit.read=todayISO(); S.edit.reread=false; if(!S.edit.started) S.edit.started=todayISO(); if(S.edit.status==="Gav upp") S.edit.status=""; saveBook(false).then(()=>{ renderModal(); toast("Markerad som läst. Sätt gärna ett betyg."); }); return;
      case "del": S.confirmDel=true; readForm(); renderModal(); return;
      case "del-no": S.confirmDel=false; readForm(); renderModal(); return;
      case "del-yes": { const b=S.edit; try{ await removeItem(b.id,b._doc); toast("Borttagen"); S.edit=null; S.confirmDel=false; renderModal(); }catch(_){} return; }
    }
  }
  if(d.phase!=null){ S.f.phase=d.phase; S.f.status=""; S.pickId=null; S.f.limit=150; render(); return; }
  if(d.book){ openBook(d.book); return; }
  if(d.scope){ S.statScope=d.scope; render(); return; }
  if(d.ser){ S.serFilter=d.ser; render(); return; }
  if(d.aw){ S.awFilter=d.aw; render(); return; }
  if(d.serread){ const s=S.series.find(x=>x.id===d.serread); if(s){ try{ await putItem("series",s.id,{...s,read:!s.read},s._doc); }catch(_){} } return; }
  if(d.plan!=null && d.plan!==""){ S.planKey=d.plan; render(); return; }
  if(d.planrm!=null){ const k=S.planKey||yymm(new Date()); const months={...S.plans}; months[k]=(months[k]||[]).filter((_,i)=>i!==+d.planrm); try{ await savePlans(months); }catch(_){} return; }
  if(d.planadd){ const b=S.books.find(x=>x.id===d.planadd); const k=S.planKey||yymm(new Date()); const months={...S.plans}; const list=(months[k]||[]).slice();
    if(list.some(i=>norm(i.title)===norm(b.title))){ toast("Finns redan i planen."); return; }
    list.push({title:b.title,pages:b.pages||"",status:b.status||""}); months[k]=list; S.planQ=""; try{ await savePlans(months); toast("Tillagd i "+planLabel(k)); }catch(_){} return; }
});
window.addEventListener("hashchange", render);

/* ---------- boot ---------- */
/* ---------- Firebase ---------- */
const FB_APP=initializeApp(FIREBASE_CONFIG);
const AUTH=getAuth(FB_APP);
let FS;
try{ FS=initializeFirestore(FB_APP,{ignoreUndefinedProperties:true, localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
catch(_){ FS=initializeFirestore(FB_APP,{ignoreUndefinedProperties:true}); }
function makeDb(uid){
  const base="users/"+uid+"/";
  const doc=p=>{ const r=fdoc(FS, base+p); return {
    set:d=>setDoc(r,d), update:d=>setDoc(r,d,{merge:true}), delete:()=>deleteDoc(r),
    get:async()=>{ const x=await getDoc(r); return {exists:x.exists(), data:()=>x.data()}; } }; };
  const collection=p=>({ onSnapshot:(next,err)=>onSnapshot(fcol(FS, base+p), snap=>next({
      docs:snap.docs.map(d=>({id:d.id, exists:true, data:()=>d.data()})),
      metadata:{fromCache:snap.metadata.fromCache, hasPendingWrites:snap.metadata.hasPendingWrites}}), err) });
  return {doc, collection};
}
async function doLogin(){
  S.authErr=null; const prov=new GoogleAuthProvider(); prov.setCustomParameters({prompt:"select_account"});
  try{ await signInWithPopup(AUTH, prov); }
  catch(e){
    if(e && (e.code==="auth/popup-blocked" || e.code==="auth/operation-not-supported-in-this-environment")){ try{ await signInWithRedirect(AUTH, prov); return; }catch(_){} }
    if(e && e.code==="auth/popup-closed-by-user") return;
    S.authErr = e && e.code==="auth/unauthorized-domain" ? "Den här adressen är inte godkänd i Firebase. Lägg till den under Authentication → Settings → Authorized domains." : "Inloggningen misslyckades ("+((e&&e.code)||"okänt fel")+"). Försök igen.";
    render();
  }
}
let unsubLib=null;
function startData(){
  let timer=setTimeout(()=>{ if(!S.loaded){ $("#sub").textContent="Databasen svarar inte än …"; } },10000);
  unsubLib=S.db.collection("lib").onSnapshot(snap=>{
    const docs={}; snap.docs.forEach(d=>{ docs[d.id]=d.data(); });
    S.docs=docs; rebuild();
    if(!snap.metadata.fromCache){ S.loaded=true; clearTimeout(timer); }
    else if(Object.keys(docs).length) S.loaded=true;
    if(S.loaded){ maybeEnrich(); setTimeout(findCovers, 4000); setTimeout(findSeries, 9000); setTimeout(findPages, 15000); setTimeout(findDeadAuthors, 6000); setTimeout(findFullNames, 3000); setTimeout(findSeriesGaps, 5000); }
    if(S.edit && S.edit.id){ const fresh=S.books.find(b=>b.id===S.edit.id); if(fresh) S.edit._doc=fresh._doc; }
    render();
  }, err=>{ clearTimeout(timer); S.loaded=true; S.error="Kunde inte läsa databasen ("+((err&&err.code)||"fel")+")."; render(); });
}
getRedirectResult(AUTH).catch(e=>{ S.authErr="Inloggningen misslyckades ("+((e&&e.code)||"okänt fel")+")."; render(); });
onAuthStateChanged(AUTH, user=>{
  if(unsubLib){ unsubLib(); unsubLib=null; }
  S.docs={}; S.loaded=false; S.enrichDone=false; rebuild();
  if(!user){ S.authState="out"; S.authUser=null; S.db=null; $("#sub").textContent="Inte inloggad"; render(); return; }
  S.authState="in"; S.authUser=user; S.db=makeDb(user.uid); render(); startData();
});
render(); loadCovers();
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
